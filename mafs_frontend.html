<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多智能体教研对话</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>

  :root {
    --bg:         #f0f4f9;
    --white:      #ffffff;
    --surface:    #f7f9fc;
    --border:     #dce4ef;
    --border-light: #eaf0f8;

    /* 主色：天蓝渐变，和参考平台一致 */
    --blue-1:     #4a9fe0;
    --blue-2:     #2d7fc9;
    --blue-grad:  linear-gradient(135deg, #5aaee8 0%, #2d7fc9 100%);

    /* 智能体专属色 */
    --peer:       #f5860a;   /* 橙 — 教学同伴 */
    --expert:     #2daa6e;   /* 绿 — 教育专家 */
    --mentor:     #7b5ea7;   /* 紫 — 资深教研员 */

    --danger:     #e05555;
    --text:       #2c3e5a;
    --text-muted: #6a7f9a;
    --text-light: #9bacc0;
    --shadow-sm:  0 2px 8px rgba(44,62,90,0.08);
    --shadow-md:  0 4px 20px rgba(44,62,90,0.12);
    --radius:     12px;
    --font:       'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  
/* ══ 通用卡片栏 ══ */
  .col {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--white);
    border-right: 1px solid var(--border);
  }
  .col:last-child { border-right: none; background: var(--surface); }
  .col-header {
    padding: 14px 18px 12px;
    border-bottom: 1px solid var(--border-light);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .col-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .col-title .icon-circle {
    width: 26px; height: 26px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    background: var(--blue-grad);
    color: #fff;
  }

  
/* ══ 中栏 ══ */
  .mid-col { background: var(--bg); border-right: 1px solid var(--border); }

  /* 智能体状态条 */
  .agent-bar {
    background: var(--white);
    border-bottom: 1px solid var(--border-light);
    padding: 8px 18px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .agent-bar-label { font-size: 11px; color: var(--text-light); white-space: nowrap; }
  .agent-chips { display: flex; gap: 8px; }
  .agent-chip {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    font-size: 12px;
    color: var(--text-muted);
    background: var(--white);
    transition: all .3s;
    font-weight: 500;
  }
  .agent-chip .chip-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border); transition: all .3s; }
  .agent-chip.active-peer   { border-color: var(--peer);   color: var(--peer);   background: #fff8f0; }
  .agent-chip.active-expert { border-color: var(--expert); color: var(--expert); background: #f0faf5; }
  .agent-chip.active-mentor { border-color: var(--mentor); color: var(--mentor); background: #f5f0fb; }
  .agent-chip.active-peer   .chip-dot { background: var(--peer);   animation: chipPulse 1s infinite; }
  .agent-chip.active-expert .chip-dot { background: var(--expert); animation: chipPulse 1s infinite; }
  .agent-chip.active-mentor .chip-dot { background: var(--mentor); animation: chipPulse 1s infinite; }
  @keyframes chipPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.5)} }

  .thinking-label {
    margin-left: auto;
    font-size: 12px;
    color: var(--text-light);
    display: flex;
    align-items: center;
    gap: 5px;
    opacity: 0;
    transition: opacity .3s;
  }
  .thinking-label.show { opacity: 1; }
  .t-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--text-light); animation: tDot 1.2s infinite; }
  .t-dot:nth-child(2){animation-delay:.2s} .t-dot:nth-child(3){animation-delay:.4s}
  @keyframes tDot { 0%,60%,100%{opacity:.3;transform:scale(1)} 30%{opacity:1;transform:scale(1.4)} }

  /* 对话区 */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
  }
  .chat-area::-webkit-scrollbar { width: 4px; }
  .chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* 欢迎屏 */
  .welcome {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    text-align: center;
    padding: 50px;
  }
  .welcome-logo { font-size: 52px; }
  .welcome h2 { font-size: 18px; font-weight: 600; color: var(--text); }
  .welcome p { font-size: 13px; color: var(--text-muted); line-height: 2; max-width: 400px; }
  .welcome-agents { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 4px; }
  .welcome-chip {
    padding: 5px 14px;
    border-radius: 30px;
    font-size: 12px;
    font-weight: 500;
    border: 1.5px solid;
  }
  .wc-peer   { border-color: var(--peer);   color: var(--peer);   background: #fff8f0; }
  .wc-expert { border-color: var(--expert); color: var(--expert); background: #f0faf5; }
  .wc-mentor { border-color: var(--mentor); color: var(--mentor); background: #f5f0fb; }

  /* 消息气泡 */
  .msg { display: flex; flex-direction: column; gap: 5px; animation: msgIn .25s ease; }
  @keyframes msgIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

  .msg-header { display: flex; align-items: center; gap: 7px; }
  .msg-avatar {
    width: 30px; height: 30px;
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .av-teacher { background: #eaf3fd; border: 1.5px solid #c0d8f0; }
  .av-peer    { background: #fff3e6; border: 1.5px solid #f5c590; }
  .av-expert  { background: #e8f8f0; border: 1.5px solid #90d9b5; }
  .av-mentor  { background: #f2edfa; border: 1.5px solid #c3a8e8; }

  .msg-role {
    font-size: 12px;
    font-weight: 600;
    padding: 2px 9px;
    border-radius: 5px;
  }
  .role-teacher { background: #eaf3fd; color: var(--blue-2); }
  .role-peer    { background: #fff3e6; color: var(--peer); }
  .role-expert  { background: #e8f8f0; color: var(--expert); }
  .role-mentor  { background: #f2edfa; color: var(--mentor); }

  .msg-time { font-size: 11px; color: var(--text-light); margin-left: auto; }

  .msg-bubble {
    padding: 11px 15px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.8;
    max-width: 88%;
    box-shadow: var(--shadow-sm);
  }
  .msg.teacher { align-items: flex-end; }
  .msg.teacher .msg-header { flex-direction: row-reverse; }
  .msg.teacher .msg-time { margin-left: 0; margin-right: auto; }
  .msg.teacher .msg-bubble {
    background: var(--blue-grad);
    color: #fff;
    border-radius: 12px 3px 12px 12px;
  }
  .msg.ai .msg-bubble {
    background: var(--white);
    border: 1px solid var(--border-light);
    border-radius: 3px 12px 12px 12px;
  }
  .msg.ai.peer   .msg-bubble { border-left: 3px solid var(--peer); }
  .msg.ai.expert .msg-bubble { border-left: 3px solid var(--expert); }
  .msg.ai.mentor .msg-bubble { border-left: 3px solid var(--mentor); }

  /* 流式光标 */
  .stream-cursor {
    display: inline-block;
    width: 2px; height: 15px;
    background: var(--text-muted);
    margin-left: 2px;
    vertical-align: middle;
    animation: cursorBlink .6s infinite;
  }
  @keyframes cursorBlink { 0%,100%{opacity:1} 50%{opacity:0} }

  /* 思考气泡 */
  .thinking-bubble {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 11px 15px;
    background: var(--white);
    border: 1px solid var(--border-light);
    border-left: 3px solid var(--border);
    border-radius: 3px 12px 12px 12px;
    width: fit-content;
    box-shadow: var(--shadow-sm);
  }
  .thinking-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-light); animation: thinkDot 1.2s infinite; }
  .thinking-dot:nth-child(2){animation-delay:.2s} .thinking-dot:nth-child(3){animation-delay:.4s}
  @keyframes thinkDot { 0%,60%,100%{transform:translateY(0);opacity:.4} 30%{transform:translateY(-5px);opacity:1} }

  /* 输入区 */
  .input-area {
    padding: 12px 18px 16px;
    border-top: 1px solid var(--border-light);
    flex-shrink: 0;
    background: var(--white);
  }
  .input-row { display: flex; gap: 8px; align-items: flex-end; }
  .chat-input {
    flex: 1;
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    color: var(--text);
    font-size: 14px;
    font-family: var(--font);
    outline: none;
    resize: none;
    min-height: 44px;
    max-height: 110px;
    line-height: 1.5;
    transition: border-color .2s, box-shadow .2s;
  }
  .chat-input:focus { border-color: var(--blue-1); box-shadow: 0 0 0 3px rgba(74,159,224,0.12); }
  .chat-input::placeholder { color: var(--text-light); }

  .send-btn {
    padding: 10px 20px;
    background: var(--blue-grad);
    border: none;
    border-radius: 10px;
    color: #fff;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    height: 44px;
    box-shadow: 0 2px 8px rgba(45,127,201,0.3);
    transition: all .2s;
    font-family: var(--font);
  }
  .send-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(45,127,201,0.4); }
  .send-btn:disabled { background: var(--border); box-shadow: none; cursor: not-allowed; transform: none; }

  .terminate-btn {
    width: 100%;
    margin-top: 8px;
    padding: 9px;
    background: var(--white);
    border: 1.5px solid #f0b8b8;
    border-radius: 10px;
    color: var(--danger);
    font-size: 13px;
    cursor: pointer;
    transition: all .2s;
    font-family: var(--font);
    font-weight: 500;
  }
  .terminate-btn:hover { background: #fdf0f0; border-color: var(--danger); }

  


  /* ══ 报告样式 ══ */
  .report-section-block { margin-bottom: 14px; }
  .report-section-block h2 { font-size: 13px; font-weight: 600; color: var(--text); padding-bottom: 6px; border-bottom: 1px solid var(--border-light); margin-bottom: 8px; }
  .report-role-block { display: flex; gap: 9px; padding: 9px 11px; border-radius: 8px; margin-bottom: 7px; }
  .report-role-block.peer-block   { background: #fff8f0; border-left: 3px solid var(--peer); }
  .report-role-block.expert-block { background: #f0faf5; border-left: 3px solid var(--expert); }
  .report-role-block.mentor-block { background: #f5f0fb; border-left: 3px solid var(--mentor); }
  .report-role-avatar { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
  .report-role-label { font-size: 11px; font-weight: 600; margin-bottom: 3px; }
  .peer-label   { color: var(--peer); }
  .expert-label { color: var(--expert); }
  .mentor-label { color: var(--mentor); }
  .report-role-text { font-size: 12px; line-height: 1.8; color: var(--text-muted); }

  /* ══ 弹窗 ══ */
  .modal { display: none; position: fixed; inset: 0; z-index: 200; background: rgba(30,50,80,0.45); backdrop-filter: blur(4px); align-items: center; justify-content: center; }
  .modal.show { display: flex; }
  .modal-inner { background: var(--white); border-radius: 16px; display: flex; flex-direction: column; box-shadow: 0 24px 60px rgba(30,50,80,0.25); animation: modalIn .25s ease; }
  @keyframes modalIn { from{opacity:0;transform:scale(0.96)} to{opacity:1;transform:scale(1)} }
  .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 22px; border-bottom: 1px solid var(--border-light); }
  .modal-title { font-size: 15px; font-weight: 600; color: var(--text); }
  .modal-close { background: var(--bg); border: none; width: 28px; height: 28px; border-radius: 7px; font-size: 14px; cursor: pointer; color: var(--text-muted); transition: all .2s; }
  .modal-close:hover { background: var(--border); }
  .modal-body { flex: 1; overflow-y: auto; padding: 22px; }
  .modal-body::-webkit-scrollbar { width: 4px; }
  .modal-body::-webkit-scrollbar-thumb { background: var(--border); }
  .modal-footer { padding: 12px 22px; border-top: 1px solid var(--border-light); display: flex; justify-content: flex-end; gap: 8px; }
  .btn-primary { padding: 8px 20px; background: var(--blue-grad); border: none; border-radius: 8px; color: #fff; font-size: 13px; font-weight: 500; cursor: pointer; font-family: var(--font); }
  .btn-secondary { padding: 8px 16px; background: var(--white); border: 1px solid var(--border); border-radius: 8px; color: var(--text-muted); font-size: 13px; cursor: pointer; font-family: var(--font); }
  #report-modal .modal-inner { width: 700px; max-width: 92vw; max-height: 88vh; }

  /* Toast */
  .toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(16px); background: var(--white); border: 1px solid var(--border); border-radius: 10px; padding: 10px 22px; font-size: 13px; color: var(--text); opacity: 0; transition: all .3s; pointer-events: none; z-index: 300; box-shadow: var(--shadow-md); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.success { border-color: #90d9b5; color: var(--expert); }
  .toast.error   { border-color: #f0b8b8; color: var(--danger); }

  /* 全屏布局覆盖 */
  body { display: flex; flex-direction: column; overflow: hidden; height: 100vh; }
  .mid-col { flex: 1; border-right: none; }
</style>
</head>
<body>

<!-- 中栏：对话 -->
  <div class="col mid-col" style="flex:1;height:100vh;">
    <div class="col-header" style="background:var(--white);">
      <div class="col-title">
        <div class="icon-circle">💬</div>
        教研对话
      </div>
    </div>

    <!-- 智能体状态条 -->
    <div class="agent-bar">
      <span class="agent-bar-label">当前智能体：</span>
      <div class="agent-chips">
        <div class="agent-chip" id="ind-peer">
          <div class="chip-dot"></div>🤔 教学同伴
        </div>
        <div class="agent-chip" id="ind-expert">
          <div class="chip-dot"></div>🔬 教育专家
        </div>
        <div class="agent-chip" id="ind-mentor">
          <div class="chip-dot"></div>💡 资深教研员
        </div>
      </div>
      <div class="thinking-label" id="thinking-label">
        <div class="t-dot"></div><div class="t-dot"></div><div class="t-dot"></div>
        正在回复
      </div>
    </div>

    <!-- 消息列表 -->
    <div class="chat-area" id="chat-area">
      <div class="welcome" id="welcome-msg">
        <div class="welcome-logo">🏫</div>
        <h2>欢迎使用多智能体协同研讨系统</h2>
        <p>请结合课例证据与智能体对话，获得多视角教研反馈。</p>
        <div class="welcome-agents">
          <div class="welcome-chip wc-peer">🤔 教学同伴</div>
          <div class="welcome-chip wc-expert">🔬 教育专家</div>
          <div class="welcome-chip wc-mentor">💡 资深教研员</div>
        </div>
      </div>
    </div>

    <!-- 输入区 -->
    <div class="input-area">
      <div class="input-row">
        <textarea class="chat-input" id="chat-input" rows="1"
          placeholder="请输入您的问题，或直接@同伴、@专家、@教研员"
          onkeydown="handleKeydown(event)"
          oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="send-btn" onclick="sendMessage()">发 送</button>
      </div>
      <button class="terminate-btn" onclick="terminateDialogue()">⬛ 结束对话并生成研讨报告</button>
    </div>
  </div>

<!-- 报告弹窗 -->
<div class="modal" id="report-modal">
  <div class="modal-inner">
    <div class="modal-header">
      <span class="modal-title">📋 教研研讨报告</span>
      <button class="modal-close" onclick="closeModal('report-modal')">✕</button>
    </div>
    <div class="modal-body">
      <div id="report-modal-body"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal('report-modal')">关闭</button>
      <button class="btn-primary" onclick="downloadReport()">↓ 下载 Word</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const API_BASE = "";
  let isWaiting = false;
  let reportRawText = '';

// 接口信息？
  const REPORT_ID  = "test01"; //测试用，之后从平台动态获取
  const TEACHER_NAME = "张老师"; //测试用，之后从登录态获取
  const LESSON_INFO = {
    subject: "英语",
    grade: "六年级上",
    teacher: "张笑笑",
    school: "建华实验学校",
    date: "2025-12-22",
  }; //测试用，之后从平台动态获取
  let REPORT_CONTENT = "";
  fetch("test01.txt")
    .then(res => res.text())
    .then(text => {
      REPORT_CONTENT = text;})
    .catch(err => {
      console.error("读取报告内容失败:", err);
    });//测试用，之后从平台动态获取

  // ── 发送消息 ──────────────────────────────────────────────
  async function sendMessage() {
    if (isWaiting) return;
    const input = document.getElementById('chat-input');
    const text  = input.value.trim();
    if (!text) return;

    const wm = document.getElementById('welcome-msg');
    if (wm) wm.style.display = 'none';

    appendTeacherMsg(text);
    input.value = '';
    autoResize(input);

    isWaiting = true;
    document.getElementById('send-btn').disabled = true;
    setThinking(true);
    const thinkId = showThinkingBubble();

    try {
      const res = await fetch(`${API_BASE}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          report_id: REPORT_ID,
          message: text,
          teacher_name: TEACHER_NAME,
          lesson_info: LESSON_INFO,
          report_content: REPORT_CONTENT,
        }),
      });
      const data = await res.json();
      removeEl(thinkId);
      setThinking(false);

      if (data.content) {
        const roleClass = roleToClass(data.role);
        setAgentActive(roleClass);
        const { bubbleEl, cursor } = createStreamBubble(data.role || '智能体', roleClass);
        await typewriterEffect(bubbleEl, cursor, data.content);
        setAgentActive(null);
        if (data.report) {
          reportRawText = data.report;
        }
      }
    } catch (err) {
      removeEl(thinkId);
      setAgentActive(null);
      showToast('请求失败，请检查后端服务', 'error');
    } finally {
      isWaiting = false;
      setThinking(false);
      document.getElementById('send-btn').disabled = false;
    }
  }

  // ── 逐字打印 ──────────────────────────────────────────────
  function typewriterEffect(bubbleEl, cursor, text) {
    return new Promise(resolve => {
      let i = 0;
      const chars = [...text];
      function next() {
        if (i >= chars.length) { cursor.remove(); resolve(); return; }
        if (chars[i] === '\n') bubbleEl.insertBefore(document.createElement('br'), cursor);
        else bubbleEl.insertBefore(document.createTextNode(chars[i]), cursor);
        i++;
        scrollChat();
        setTimeout(next, 18);
      }
      next();
    });
  }

  // ── 创建流式气泡 ──────────────────────────────────────────
  function createStreamBubble(roleName, roleClass) {
    const area = document.getElementById('chat-area');
    const avatarEmoji = { peer: '🤔', expert: '🔬', mentor: '💡' };
    const emoji = avatarEmoji[roleClass] || '🤖';
    const time  = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    const msgEl = document.createElement('div');
    msgEl.className = `msg ai ${roleClass}`;
    const header = document.createElement('div');
    header.className = 'msg-header';
    header.innerHTML = `
      <div class="msg-avatar av-${roleClass}">${emoji}</div>
      <div class="msg-role role-${roleClass}">${roleName}</div>
      <div class="msg-time">${time}</div>`;
    const bubbleEl = document.createElement('div');
    bubbleEl.className = 'msg-bubble';
    const cursor = document.createElement('span');
    cursor.className = 'stream-cursor';
    bubbleEl.appendChild(cursor);
    msgEl.appendChild(header);
    msgEl.appendChild(bubbleEl);
    area.appendChild(msgEl);
    scrollChat();
    return { msgEl, bubbleEl, cursor };
  }

  // ── 辅助函数 ──────────────────────────────────────────────
  function appendTeacherMsg(text) {
    const area = document.getElementById('chat-area');
    const time  = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    const div = document.createElement('div');
    div.className = 'msg teacher';
    div.innerHTML = `
      <div class="msg-header">
        <div class="msg-avatar av-teacher">🧑‍🏫</div>
        <div class="msg-role role-teacher">教师</div>
        <div class="msg-time">${time}</div>
      </div>
      <div class="msg-bubble">${escapeHtml(text)}</div>`;
    area.appendChild(div);
    scrollChat();
  }

  function showThinkingBubble() {
    const area = document.getElementById('chat-area');
    const id = 'think-' + Date.now();
    const div = document.createElement('div');
    div.id = id;
    div.className = 'msg ai';
    div.innerHTML = `
      <div class="msg-header">
        <div class="msg-avatar" style="background:#f5f5f5;border:1.5px solid var(--border)">⏳</div>
        <div class="msg-role" style="background:#f5f5f5;color:var(--text-muted)">思考中</div>
      </div>
      <div class="thinking-bubble">
        <div class="thinking-dot"></div>
        <div class="thinking-dot"></div>
        <div class="thinking-dot"></div>
      </div>`;
    area.appendChild(div);
    scrollChat();
    return id;
  }

  function removeEl(id) { const el = document.getElementById(id); if (el) el.remove(); }
  function scrollChat() { const a = document.getElementById('chat-area'); a.scrollTop = a.scrollHeight; }

  function setThinking(on) {
    document.getElementById('thinking-label').classList.toggle('show', on);
  }

  function setAgentActive(role) {
    ['peer', 'expert', 'mentor'].forEach(r => {
      const el = document.getElementById('ind-' + r);
      el.className = 'agent-chip' + (role === r ? ' active-' + r : '');
    });
  }

  function roleToClass(role) {
    if (!role) return 'peer';
    if (role.includes('同伴')) return 'peer';
    if (role.includes('专家')) return 'expert';
    if (role.includes('教研员')) return 'mentor';
    return 'peer';
  }

  // ── 结束对话 ──────────────────────────────────────────────
  async function terminateDialogue() {
    if (!confirm('确认结束本次对话并生成研讨报告？')) return;
    const btn = document.querySelector('.terminate-btn');
    btn.textContent = '⏳ 正在生成报告...';
    btn.disabled = true;
    try {
      const res  = await fetch(`${API_BASE}/terminate`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          report_id: REPORT_ID,
          teacher_name: TEACHER_NAME,
          lesson_info: LESSON_INFO,
          report_content: REPORT_CONTENT,
        }),
      });
      const data = await res.json();
      if (data.report) {
        reportRawText = data.report;
        openReportModal();
        showToast('研讨报告已生成！', 'success');
      }
    } catch (err) {
      showToast('报告生成失败：' + err.message, 'error');
    } finally {
      btn.textContent = '⬛ 结束对话并生成研讨报告';
      btn.disabled = false;
    }
  }

  // ── 报告弹窗 ──────────────────────────────────────────────
  function openReportModal() {
    if (!reportRawText) { showToast('暂无报告，请先结束对话', 'error'); return; }
    document.getElementById('report-modal-body').innerHTML = buildReportHtml(reportRawText);
    document.getElementById('report-modal').classList.add('show');
  }
  function closeModal(id) { document.getElementById(id).classList.remove('show'); }

  function buildReportHtml(text) {
    const lines = text.split('\n');
    let html = '';
    let inSection = false;
    const rolePatterns = [
      { key: '教学同伴', cls: 'peer-block',   labelCls: 'peer-label',   avatar: '🤔', label: '🤔 教学同伴视角' },
      { key: '教育专家', cls: 'expert-block', labelCls: 'expert-label', avatar: '🔬', label: '🔬 教育专家视角' },
      { key: '教研员',   cls: 'mentor-block', labelCls: 'mentor-label', avatar: '💡', label: '💡 教研员视角' },
    ];
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i].trim();
      if (!line) continue;
      if (!line.startsWith('#') && !html) continue;
      if (line.startsWith('#')) {
        if (inSection) html += '</div>';
        html += `<div class="report-section-block"><h2>${escapeHtml(line.replace(/^#+\s*/, ''))}</h2>`;
        inSection = true;
        continue;
      }
      let matched = false;
      for (const rp of rolePatterns) {
        if (line.includes(rp.key + '视角') || line.includes('【' + rp.avatar)) {
          let content = '';
          let j = i + 1;
          while (j < lines.length) {
            const next = lines[j].trim();
            if (!next) { j++; continue; }
            if (rolePatterns.some(r => next.includes(r.key + '视角') || next.includes('【' + r.avatar) || next.startsWith('#'))) break;
            content += escapeHtml(next) + '<br>';
            j++;
          }
          i = j - 1;
          html += `<div class="report-role-block ${rp.cls}">
            <div class="report-role-avatar">${rp.avatar}</div>
            <div><div class="report-role-label ${rp.labelCls}">${rp.label}</div>
            <div class="report-role-text">${content || escapeHtml(line)}</div></div></div>`;
          matched = true; break;
        }
      }
      if (!matched) html += `<p>${escapeHtml(line)}</p>`;
    }
    if (inSection) html += '</div>';
    if (!html.trim()) html = `<pre style="font-size:12px;line-height:1.9;white-space:pre-wrap;color:var(--text-muted)">${escapeHtml(text)}</pre>`;
    return html;
  }

  // ── 下载 Word ─────────────────────────────────────────────
  function downloadReport() {
    if (!reportRawText) { showToast('暂无报告，请先结束对话', 'error'); return; }
    const htmlDoc = `<html xmlns:o='urn:schemas-microsoft-com:office:office'
        xmlns:w='urn:schemas-microsoft-com:office:word'
        xmlns='http://www.w3.org/TR/REC-html40'>
      <head><meta charset='utf-8'><title>研讨报告</title>
      <style>body{font-family:宋体;font-size:12pt;line-height:1.8;margin:2cm}
      h1{font-size:16pt;text-align:center;margin-bottom:20pt}
      h2{font-size:13pt;border-bottom:1px solid #ccc;padding-bottom:4pt;margin-top:16pt}
      p{margin:6pt 0}</style></head>
      <body><h1>教研研讨报告</h1>
      <p><b>生成时间：</b>${new Date().toLocaleString('zh-CN')}</p><hr>
      <pre style="font-family:宋体;font-size:12pt;line-height:1.8;white-space:pre-wrap">${reportRawText}</pre>
      </body></html>`;
    const blob = new Blob(['\ufeff' + htmlDoc], { type: 'application/msword' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = `研讨报告_${new Date().toLocaleDateString('zh-CN')}.doc`; a.click();
    URL.revokeObjectURL(url);
    showToast('已下载 Word 文件', 'success');
  }

  // ── 通用工具 ──────────────────────────────────────────────
  function handleKeydown(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 110) + 'px';
  }

  function escapeHtml(text) {
    return String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  }

  function showToast(msg, type = '') {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.className = `toast ${type} show`;
    setTimeout(() => toast.classList.remove('show'), 3000);
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal('report-modal');
  });
  document.querySelectorAll('.modal').forEach(m => {
    m.addEventListener('click', e => { if (e.target === m) m.classList.remove('show'); });
  });

</script>
</body>
</html>
